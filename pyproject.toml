[project]
name = "iterum"
version = "0.1.0"
description = "An agent that remembers how each counterparty behaved, and changes its terms accordingly."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
